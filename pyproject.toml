# The `pysolidcraft` package: the single module `pysolidcraft.py`, which
# drives SolidCraft (https://solidcraft.io/) from Python.  Nothing
# outside the standard library is needed to run it; SolidCraft itself
# (its GUI, or `solidcraft-cli` for headless sessions) is installed
# separately.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysolidcraft"
dynamic = ["version"]
description = "Python bindings for SolidCraft: one method per SolidCraft command"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "Wayne C. Gramlich" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
]

[project.scripts]
pysolidcraft = "pysolidcraft:main"

[project.urls]
Homepage = "https://github.com/waynegramlich/scraftpybind"
Issues = "https://github.com/waynegramlich/scraftpybind/issues"
SolidCraft = "https://github.com/tangency-labs/solidcraft"

[tool.setuptools]
py-modules = ["pysolidcraft"]

[tool.setuptools.dynamic]
version = { attr = "pysolidcraft.__version__" }

[tool.pylint.main]
# `examples/` imports `pysolidcraft` from the top directory.
source-roots = ["."]
